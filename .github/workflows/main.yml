
name: Build Luganda AI Studio APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Create Android project
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Luganda AI Studio" "com.openuse9.lugandaai" --web-dir frontend
          npx cap add android
          npx cap sync android

      - name: Align Kotlin libraries
        run: |
          find android -name "*.gradle" -type f -exec sed -i 's/kotlin-stdlib-jdk8:1.6.21/kotlin-stdlib-jdk8:1.8.22/g' {} +

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: luganda-ai-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
